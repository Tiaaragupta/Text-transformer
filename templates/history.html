<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>History - The Text Transformer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #1e3a2f 0%, #0f1f19 60%, #0a1512 100%);
      color: #f2ede4;
      padding: 60px 24px;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 2.4rem;
      font-weight: 400;
      margin-bottom: 8px;
    }
    h1 em { color: #7fd8b9; font-style: normal; }
    a.back {
      color: #d9b872;
      text-decoration: none;
      font-size: 0.95rem;
      display: inline-block;
      margin-bottom: 32px;
    }
    a.back:hover { text-decoration: underline; }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 8px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 16px 20px; font-size: 0.95rem; }
    th {
      color: #d9b872;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    td { border-bottom: 1px solid rgba(255,255,255,0.06); color: #f2ede4; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.03); }
    .transformed { color: #7fd8b9; font-weight: 600; }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #a8a39a;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Submission <em>History</em></h1>
    <a class="back" href="/">&larr; Back to transformer</a>

    <div class="card">
      {% if records %}
      <table>
        <thead>
          <tr><th>#</th><th>Original</th><th>Transformed</th><th>Created At</th></tr>
        </thead>
        <tbody>
          {% for r in records %}
          <tr>
            <td>{{ r.id }}</td>
            <td>{{ r.original_text }}</td>
            <td class="transformed">{{ r.transformed_text }}</td>
            <td>{{ r.created_at }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      {% else %}
      <p class="empty">No submissions yet — go transform some text!</p>
      {% endif %}
    </div>
  </div>
</body>
</html>
